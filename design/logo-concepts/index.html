<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nectar N mark concepts</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      body { margin: 0; background: #12181f; color: #d4d4d8; font-family: Geist, sans-serif; padding: 40px; }
      h1 { color: #fff; font-size: 22px; font-weight: 600; margin: 0 0 6px; }
      .sub { color: #71717a; font-size: 14px; margin: 0 0 32px; }
      .row { display: grid; grid-template-columns: 210px 1fr; gap: 24px; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); padding: 26px 0; }
      .label { font-size: 15px; color: #fff; font-weight: 600; }
      .label small { display: block; color: #71717a; font-weight: 400; font-size: 12px; margin-top: 4px; line-height: 1.45; }
      .sizes { display: flex; align-items: center; gap: 36px; flex-wrap: wrap; }
      .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; }
      .cell span { font-size: 11px; color: #52525b; font-family: monospace; }
      .light { background: #f4f4f5; border-radius: 10px; padding: 10px; display: flex; align-items: center; gap: 8px; }
      .lockup { display: flex; align-items: center; gap: 10px; }
      .lockup b { color: #fff; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
      svg.mark { display: block; }
    </style>
  </head>
  <body>
    <h1>Nectar &ldquo;N&rdquo; mark concepts</h1>
    <p class="sub">Orange/amber, ribbon-fold 3D in the spirit of the ReproConnect R. Each shown at 128 / 48 / 24 / 16 px, in a header lockup, and on light.</p>

    <svg width="0" height="0" style="position:absolute">
      <defs>
        <!-- ===== C1: Ribbon N, diagonal tucked behind ===== -->
        <linearGradient id="c1-l" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#FF9500"/>
        </linearGradient>
        <linearGradient id="c1-r" x1="0" y1="0" x2="0.4" y2="1">
          <stop offset="0" stop-color="#FFB733"/><stop offset="1" stop-color="#FF7A00"/>
        </linearGradient>
        <linearGradient id="c1-d" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#E8821E"/><stop offset="0.5" stop-color="#D96A00"/><stop offset="1" stop-color="#AD4E00"/>
        </linearGradient>
        <linearGradient id="c1-shL" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity="0.32"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
        </linearGradient>
        <linearGradient id="c1-shR" x1="1" y1="0" x2="0" y2="0">
          <stop offset="0" stop-color="#000" stop-opacity="0.32"/><stop offset="1" stop-color="#000" stop-opacity="0"/>
        </linearGradient>
        <symbol id="c1" viewBox="0 0 100 100">
          <path d="M14 32 L36 13 L86 68 L64 87 Z" fill="url(#c1-d)"/>
          <path d="M36 13 L48 26 L36 37 Z" fill="url(#c1-shL)"/>
          <path d="M64 87 L52 74 L64 63 Z" fill="url(#c1-shR)"/>
          <rect x="12" y="12" width="24" height="76" rx="12" fill="url(#c1-l)"/>
          <rect x="64" y="12" width="24" height="76" rx="12" fill="url(#c1-r)"/>
        </symbol>

        <!-- ===== C2: Continuous ribbon, round caps, alternating folds ===== -->
        <linearGradient id="c2-a" gradientUnits="userSpaceOnUse" x1="24" y1="22" x2="24" y2="85">
          <stop offset="0" stop-color="#FFD84D"/><stop offset="1" stop-color="#FF9500"/>
        </linearGradient>
        <linearGradient id="c2-b" gradientUnits="userSpaceOnUse" x1="24" y1="22" x2="76" y2="78">
          <stop offset="0" stop-color="#FF9E1F"/><stop offset="1" stop-color="#C75C00"/>
        </linearGradient>
        <linearGradient id="c2-c" gradientUnits="userSpaceOnUse" x1="76" y1="78" x2="76" y2="15">
          <stop offset="0" stop-color="#FF8000"/><stop offset="1" stop-color="#FFC400"/>
        </linearGradient>
        <symbol id="c2" viewBox="0 0 100 100">
          <path d="M76 78 L76 15" stroke="url(#c2-c)" stroke-width="24" stroke-linecap="round" fill="none"/>
          <path d="M24 22 L76 78" stroke="url(#c2-b)" stroke-width="24" stroke-linecap="round" fill="none"/>
          <path d="M24 85 L24 22" stroke="url(#c2-a)" stroke-width="24" stroke-linecap="round" fill="none"/>
        </symbol>

        <!-- ===== C3: Chamfer extrude ===== -->
        <linearGradient id="c3-f" x1="0" y1="0" x2="0.5" y2="1">
          <stop offset="0" stop-color="#FFC400"/><stop offset="1" stop-color="#FF7E00"/>
        </linearGradient>
        <symbol id="c3" viewBox="0 0 100 100">
          <path d="M22 92 V16 H40 L62 55 V16 H80 V92 H62 L40 53 V92 Z" transform="translate(5,-4)" fill="#9C4400"/>
          <path d="M22 92 V16 H40 L62 55 V16 H80 V92 H62 L40 53 V92 Z" fill="url(#c3-f)"/>
        </symbol>

        <!-- ===== C4: Honeycomb hex badge ===== -->
        <linearGradient id="c4-h" x1="0" y1="0" x2="0.35" y2="1">
          <stop offset="0" stop-color="#FFC400"/><stop offset="1" stop-color="#F06D00"/>
        </linearGradient>
        <linearGradient id="c4-e" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFF" stop-opacity="0.35"/><stop offset="0.35" stop-color="#FFF" stop-opacity="0"/>
        </linearGradient>
        <symbol id="c4" viewBox="0 0 100 100">
          <path d="M50 3 L90 26 V74 L50 97 L10 74 V26 Z" fill="url(#c4-h)"/>
          <path d="M50 3 L90 26 V74 L50 97 L10 74 V26 Z" fill="url(#c4-e)"/>
          <path d="M32 72 V28 H41 L59 58 V28 H68 V72 H59 L41 42 V72 Z" fill="#fff"/>
        </symbol>

        <!-- ===== C5: Beveled glass N ===== -->
        <linearGradient id="c5-f" x1="0" y1="0" x2="0.3" y2="1">
          <stop offset="0" stop-color="#FFCC33"/><stop offset="0.55" stop-color="#FF9500"/><stop offset="1" stop-color="#F07000"/>
        </linearGradient>
        <linearGradient id="c5-gloss" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFF" stop-opacity="0.5"/><stop offset="1" stop-color="#FFF" stop-opacity="0"/>
        </linearGradient>
        <symbol id="c5" viewBox="0 0 100 100">
          <path id="c5n" d="M14 76 V24 A12 12 0 0 1 34.5 15.5 L64 49 V24 A12 12 0 0 1 88 24 V76 A12 12 0 0 1 67.5 84.5 L38 51 V76 A12 12 0 0 1 14 76 Z" fill="url(#c5-f)"/>
          <path d="M14 44 V24 A12 12 0 0 1 34.5 15.5 L64 49 V24 A12 12 0 0 1 88 24 V44 C63 52 39 52 14 44 Z" fill="url(#c5-gloss)" opacity="0.55"/>
        </symbol>
      </defs>
    </svg>

    <div id="rows"></div>

    <script>
      const CONCEPTS = [
        ["current", "Current honeycomb", "Reference. The pain point: illegible below 32px.", true],
        ["c1", "C1 · Ribbon fold", "Rounded stems over a tucked diagonal; fold shadows at the joins carry the 3D, like the R."],
        ["c2", "C2 · Continuous ribbon", "One bent ribbon, round caps, three gradient runs; folds alternate over/under."],
        ["c3", "C3 · Chamfer extrude", "Flat gold face with a hard drafting-style extrusion. Most architectural of the set."],
        ["c4", "C4 · Honeycomb badge", "Keeps the hex heritage; white N knocked out of a glossy amber cell."],
        ["c5", "C5 · Glass bevel", "Single soft-geometry N with a gloss sweep. App-icon energy."],
      ];
      const SIZES = [128, 48, 24, 16];
      const rows = document.getElementById("rows");
      for (const [id, name, note, isImg] of CONCEPTS) {
        const mark = (s) => isImg
          ? '<img src="/nectar-logo.svg" width="' + s + '" alt="">'
          : '<svg class="mark" width="' + s + '" height="' + s + '"><use href="#' + id + '"/></svg>';
        rows.insertAdjacentHTML("beforeend",
          '<div class="row"><div class="label">' + name + '<small>' + note + '</small></div>' +
          '<div class="sizes">' +
          SIZES.map((s) => '<div class="cell">' + mark(s) + '<span>' + s + '</span></div>').join("") +
          '<div class="cell"><div class="lockup">' + mark(32) + '<b>Nectar</b></div><span>header lockup</span></div>' +
          '<div class="cell"><div class="light">' + mark(28) + mark(16) + '</div><span>on light</span></div>' +
          '</div></div>');
      }
    </script>
  </body>
</html>
